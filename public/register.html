
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kayıt Ol - Karanfil Collab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <a href="/" class="logo">
            KARANFİL COLLAB
        </a>

        <div class="nav-buttons">
            <a href="/" class="btn btn-outline">Ana Sayfa</a>
            <a href="login.html" class="btn btn-primary">Giriş Yap</a>
        </div>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <p class="badge">
                KARANFİL COLLAB
            </p>

            <h1>Hesap Oluştur</h1>

            <p class="auth-description">
                Karanfil Collab kullanmaya başlamak için kayıt ol.
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="username">
                        Kullanıcı Adı
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="kullaniciadi"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ornek@mail.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Şifre
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Şifren"
                        required
                    >

                </div>


                <button type="submit" class="btn btn-primary btn-full">
                    Kayıt Ol
                </button>

            </form>


            <p id="message" class="form-message"></p>


            <p class="auth-footer">

                Zaten hesabın var mı?

                <a href="login.html">
                    Giriş Yap
                </a>

            </p>

        </div>

    </main>


    <script>

        const registerForm = document.getElementById("registerForm");
        const message = document.getElementById("message");

        registerForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {

                const response = await fetch("/register", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })

                });

                const data = await response.json();

                message.textContent = data.message;

                if (response.ok) {

                    setTimeout(() => {

                        window.location.href = "/login.html";

                    }, 1000);

                }

            } catch (error) {

                console.log(error);

                message.textContent = "Sunucuya bağlanılamadı.";

            }

        });

    </script>

</body>
</html>
