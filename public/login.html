
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giriş Yap - Karanfil Collab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <a href="/" class="logo">
            KARANFİL COLLAB
        </a>

        <div class="nav-buttons">
            <a href="/" class="btn btn-outline">Ana Sayfa</a>
            <a href="register.html" class="btn btn-primary">Kayıt Ol</a>
        </div>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <p class="badge">
                KARANFİL COLLAB
            </p>

            <h1>Giriş Yap</h1>

            <p class="auth-description">
                Hesabına giriş yap ve endpointlerini yönet.
            </p>


            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ornek@mail.com"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Şifre</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Şifren"
                        required
                    >
                </div>


                <button type="submit" class="btn btn-primary btn-full">
                    Giriş Yap
                </button>

            </form>


            <p id="message" class="form-message"></p>


            <p class="auth-footer">
                Hesabın yok mu?
                <a href="register.html">Kayıt Ol</a>
            </p>

        </div>

    </main>


    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {

                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });

                const data = await response.json();

                if (data.message === "Giriş Başarılı") {

                    window.location.href = "/dashboard.html";

                } else {

                    message.textContent = data.message;

                }

            } catch (error) {

                console.log(error);

                message.textContent = "Sunucuya bağlanılamadı.";

            }

        });

    </script>

</body>
</html>
